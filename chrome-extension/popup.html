<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园网自动登录</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-avatar-box" id="brandAvatar" title="点击打开偏好设置" role="button" tabindex="0">
          <img src="icons/icon32.png" alt="Logo" class="brand-img">
          <span class="avatar-beacon" id="avatarBeacon"></span>
        </div>
        <div class="brand-meta">
          <span class="brand-name">校园网自动登录</span>
        </div>
      </div>
      <div class="header-tools">
        <span class="ver-pill" id="ver" title="点击打开设置中心">v1.0.0</span>
        <button type="button" id="btnThemeToggle" class="icon-btn theme-btn" title="切换深色/浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button type="button" id="btnRefresh" class="icon-btn" title="刷新状态">
          <svg class="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Ambient Hero Status Card (Live Glowing Mesh Card) -->
    <section class="card status-card" id="statusCard">
      <div class="status-glow"></div>
      
      <div class="status-main">
        <div class="status-beacon">
          <span class="pulse-ring"></span>
          <span class="dot"></span>
        </div>
        <div class="status-content">
          <div class="status-title" id="statusTitle">正在检测…</div>
          <div class="status-desc" id="statusDesc" style="display: none;"></div>
        </div>
        <span class="status-state-pill" id="statusStatePill">检测中</span>
      </div>

      <div class="status-bottom-bar">
        <!-- Pill IP Tag with Click Feedback -->
        <div class="ip-capsule" id="ipChip" title="点击复制本机 IP">
          <div class="ip-prefix">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span>IP</span>
          </div>
          <span class="ip-text" id="localIp">正在获取…</span>
          <button type="button" class="copy-hint" title="复制 IP">
            <svg class="copy-svg" id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>

        <span class="gw-route-pill" id="popGwTag" title="Dr.COM ePortal 认证网关地址">
          <span class="gw-route-dot"></span>
          <span>172.30.100.2</span>
        </span>
      </div>
    </section>

    <!-- Seamless Metrics Dock (真正的无界通透展台) -->
    <section class="metrics-dock">
      <!-- 1: 在线时长 -->
      <div class="dock-item" title="当前已在线时长">
        <div class="dock-head">
          <svg class="dock-icon amber" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>在线时长</span>
        </div>
        <div class="dock-value" id="onlineDuration">—</div>
      </div>

      <!-- 2: 已用流量 (专业双向数据传输图标) -->
      <div class="dock-item" title="本期已消耗流量 (悬停查看上传/下载)">
        <div class="dock-head">
          <svg class="dock-icon purple" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 10l5-5 5 5"/>
            <path d="M12 5v14"/>
            <path d="M17 14l-5 5-5-5"/>
          </svg>
          <span>已用流量</span>
          <span class="flow-sub-tag" id="popFlowSub"></span>
        </div>
        <div class="dock-value" id="popFlow">—</div>
        <div class="flow-bar-wrap" id="flowBarWrap" style="display: none;" title="上传与下载比例">
          <div class="flow-bar-dl" id="flowBarDl" style="width: 50%;"></div>
          <div class="flow-bar-ul" id="flowBarUl" style="width: 50%;"></div>
        </div>
      </div>

      <!-- 3: 网关延迟 (动态信号脉冲波) -->
      <div class="dock-item" title="网关响应延迟">
        <div class="dock-head">
          <svg class="dock-icon emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>网关延迟</span>
          <div class="dock-sparkline" id="popPingSparkline" title="心跳延迟波动走势">
            <span class="spark-bar"></span>
            <span class="spark-bar"></span>
            <span class="spark-bar"></span>
            <span class="spark-bar"></span>
          </div>
        </div>
        <div class="dock-value" id="popPing">—</div>
      </div>

      <!-- 4: 当前账号 (安全认证身份徽章) -->
      <div class="dock-item" id="accountDockItem" title="当前登录上网账号与运营商">
        <div class="dock-head">
          <svg class="dock-icon blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>认证账号</span>
          <span class="isp-badge" id="accountIsp" role="button" tabindex="0" title="点击可快捷切换运营商 (校园/电信/联通/其他)">校园</span>
        </div>
        <div class="dock-value-row">
          <div class="dock-value mono ellipsis" id="account" title="点击切换自习室防窥模式">—</div>
          <div class="dock-btn-group">
            <button type="button" class="dock-copy-btn" id="btnToggleMask" title="自习室防窥模式开关" aria-label="自习室防窥模式开关">
              <svg id="maskIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button type="button" class="dock-copy-btn" id="btnCopyAccount" title="点击复制账号" aria-label="点击复制账号">
              <svg id="copyAccountIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Alert / Toast Capsule (操作或异常时灵动滑入) -->
    <div class="msg-box" id="msgBox" role="status" aria-live="polite">
      <span class="msg-icon" id="msgIcon"></span>
      <span class="msg-text" id="msg"></span>
    </div>

    <!-- Action Buttons with Animated Shimmer Light Beam -->
    <div class="actions-group">
      <button type="button" id="btnLogin" class="btn-primary">
        <span class="btn-shimmer"></span>
        <span class="btn-spinner"></span>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span id="btnLoginText">立即登录</span>
      </button>

      <button type="button" id="btnLogout" class="btn-secondary" title="注销下线当前校园网会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>注销</span>
      </button>
    </div>

    <!-- Footer Toolbar -->
    <footer class="footer">
      <a href="#" id="openOptions" class="foot-link" title="打开控制中心与偏好设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>偏好设置</span>
      </a>
      <span class="foot-sep"></span>
      <a href="http://172.30.100.2/" target="_blank" rel="noopener noreferrer" class="foot-link" title="打开校园网网页门户">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>网页门户</span>
      </a>
    </footer>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
